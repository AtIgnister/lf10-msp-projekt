<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="main.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/charts.css/dist/charts.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="colorscheme.css">
    <link rel="stylesheet" href="chartStyle.css">
    <title>Document</title>
</head>
<body>
    <form action="javascript:;" onsubmit=" copy()">
        <div class="form-group">
            <select class="form-select" id="emotion">
                <option value="Select emotion" disabled selected hidden>Select an Emotion</option>
                <option value="😀">😀 Happy</option>
                <option value="😒">😒 Annoyed</option>
                <option value="🤨">🤨 Confused</option>
                <option value="😢">😢 Sad</option>
                <option value="😰">😰 Anxious</option>
                <option value="😐">😐 Neutral</option>
            </select>
        </div>
        <div class="form-group">
            <textarea class="form-control" id="comment" name="hi" placeholder="Input Your comment"></textarea>
        </div>
    <button class="btn btn-primary" type="submit">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-clipboard" viewBox="0 0 16 16">
            <path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1z"></path>
            <path d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0z"></path>
        </svg>
        Copy
</button> 
    </form>  
    <div id="viewChart">
        <table class="charts-css column show-heading show-labels">
            
            <tbody>
                <tr>
                    <th scope="row">😀</th>
                    <td>12</td>
                </tr>
                <tr>
                    <th scope="row">😒</th>
                    <td>12</td>
                </tr>
                <tr>
                    <th scope="row">🤨</th>
                    <td>12</td>
                </tr>
                <tr>
                    <th scope="row">😢</th>
                    <td>12</td>
                </tr>
                <tr>
                    <th scope="row">😰</th>
                    <td>12</td>
                </tr>
                <tr>
                    <th scope="row">😐</th>
                    <td>12</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
