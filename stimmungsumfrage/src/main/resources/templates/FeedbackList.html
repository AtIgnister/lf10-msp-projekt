<!DOCTYPE html>
<html lang="de"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Feedbacks mit Text</title>
</head>

<body>
<section layout:fragment="content">
    <h2 class="mb-3">Feedbacks mit Text</h2>

    <div class="table-responsive" th:if="${!#lists.isEmpty(feedbacks)}">
        <table class="table table-striped table-bordered align-middle">
            <thead>
            <tr>
                <th>ID <a href="/feedbacks/id/desc">^</a><a href="/feedbacks/id/asc">v</a></th>
                <th>Abteilung <a href="/feedbacks/department/desc">^</a><a href="/feedbacks/department/asc">v</a></th>
                <th>Stimmung <a href="/feedbacks/mood/desc">^</a><a href="/feedbacks/mood/asc">v</a></th>
                <th>Feedback </th>
                <th>Erstellt am <a href="/feedbacks/created_at/desc">^</a><a href="/feedbacks/created_at/asc">v</a></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="feedback : ${feedbacks}">
                <td th:text="${feedback.id}">1</td>
                <td th:text="${feedback.department.name}">IT</td>
                <td th:text="${feedback.mood.moodName}">HAPPY</td>
                <td th:text="${feedback.feedbackText}">Sehr gut</td>
                <td th:text="${#temporals.format(feedback.createdAt, 'dd.MM.yyyy HH:mm')}">01.01.2026 10:00</td>
            </tr>
            </tbody>
        </table>
    </div>

    <p class="text-muted" th:if="${#lists.isEmpty(feedbacks)}">Keine Feedbacks mit Text gefunden.</p>
</section>
</body>
</html>
