<!DOCTYPE html>
<html lang="de"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Feedbacks</title>
</head>

<body>
<section layout:fragment="content" class="fade-in">
    <h2 class="page-heading mb-4">Kanal-Feedbacks</h2>

    <div class="card surface-panel p-3 mb-4">
        <form class="row g-3 align-items-end" method="get" th:action="@{/feedbacks}">
            <div class="col-12 col-md-4">
                <label class="form-label" for="departmentId">Abteilung</label>
                <select class="form-select" id="departmentId" name="departmentId">
                    <option value="">Alle Abteilungen</option>
                    <option th:each="department : ${departments}"
                            th:value="${department.id}"
                            th:text="${department.name}"
                            th:selected="${selectedDepartmentId != null and selectedDepartmentId == department.id}">
                        IT
                    </option>
                </select>
            </div>

            <div class="col-12 col-md-4">
                <label class="form-label" for="channelId">Kanal (nur meine)</label>
                <select class="form-select" id="channelId" name="channelId">
                    <option value="">Alle meine Kanaele</option>
                    <option th:each="channel : ${myChannels}"
                            th:value="${channel.id}"
                            th:text="${channel.name}"
                            th:selected="${selectedChannelId != null and selectedChannelId == channel.id}">
                        Team Channel
                    </option>
                </select>
            </div>

            <div class="col-12 col-md-2">
                <label class="form-label" for="date">Datum</label>
                <input class="form-control" id="date" name="date" type="date"
                       th:value="${selectedDate != null ? #temporals.format(selectedDate, 'yyyy-MM-dd') : ''}">
            </div>

            <div class="col-12 col-md-2 d-flex gap-2">
                <button class="btn btn-primary flex-grow-1" type="submit">Filtern</button>
                <a class="btn btn-secondary" th:href="@{/feedbacks}">Reset</a>
            </div>
        </form>
    </div>

    <div class="card surface-panel" th:if="${!#lists.isEmpty(feedbacks)}">
        <div class="table-responsive">
            <table class="table table-striped table-hover mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Kanal</th>
                    <th>Abteilung</th>
                    <th>Benutzer</th>
                    <th>Stimmung</th>
                    <th>Kommentar</th>
                    <th>Erstellt am</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="feedback : ${feedbacks}">
                    <td th:text="${feedback.id}">1</td>
                    <td th:text="${feedback.channel.name}">Team</td>
                    <td th:text="${feedback.user.department.name}">IT</td>
                    <td th:text="${feedback.user.firstname + ' ' + feedback.user.lastname}">Max Mustermann</td>
                    <td th:text="${feedback.emoji != null and !#strings.isEmpty(feedback.emoji) ? feedback.emoji : '-'}">🙂</td>
                    <td th:text="${feedback.comment != null and !#strings.isEmpty(feedback.comment) ? feedback.comment : '-'}">Sehr gut</td>
                    <td th:text="${#temporals.format(feedback.createdAt, 'dd.MM.yyyy HH:mm')}">01.01.2026 10:00</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="card surface-panel p-4 text-center" th:if="${#lists.isEmpty(feedbacks)}">
        <p class="text-secondary-dark mb-0">Keine Kanal-Feedbacks gefunden.</p>
    </div>
</section>
</body>
</html>
