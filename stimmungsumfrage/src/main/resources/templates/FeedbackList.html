<!DOCTYPE html>
<html lang="de"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Feedbacks</title>
</head>

<body>
<section layout:fragment="content" class="fade-in">
    <h2 class="page-heading mb-4">Feedbacks mit Text</h2>

    <div class="card" th:if="${!#lists.isEmpty(feedbacks)}">
        <div class="table-responsive">
            <table class="table table-striped table-hover mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Abteilung</th>
                    <th>Stimmung</th>
                    <th>Feedback</th>
                    <th>Erstellt am</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="feedback : ${feedbacks}">
                    <td th:text="${feedback.id}">1</td>
                    <td th:text="${feedback.department.name}">IT</td>
                    <td th:text="${feedback.mood.moodName}">HAPPY</td>
                    <td th:text="${feedback.feedbackText}">Sehr gut</td>
                    <td th:text="${#temporals.format(feedback.createdAt, 'dd.MM.yyyy HH:mm')}">01.01.2026 10:00</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="card p-4 text-center" th:if="${#lists.isEmpty(feedbacks)}">
        <p class="text-secondary-dark mb-0">Keine Feedbacks mit Text gefunden.</p>
    </div>
</section>
</body>
</html>
