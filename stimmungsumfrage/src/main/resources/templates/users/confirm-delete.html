<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" lang="de_DE">
<head>
    <title>Users List</title>
</head>
<body>
<section layout:fragment="content" class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-danger">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0"><i class="bi bi-exclamation-triangle"></i> Confirm Deletion</h4>
                </div>
                <div class="card-body text-center py-5">
                    <i class="bi bi-person-x display-1 text-danger mb-4"></i>
                    <h5 class="card-title mb-3">
                        Are you sure you want to delete this user?
                    </h5>
                    <p class="mb-4 fs-5 fw-bold text-danger"
                       th:text="${user.firstname} + ' ' + ${user.lastname}+' (' + ${user.email} + ')'">
                    </p>

                    <form th:action="@{/admin/users/{id}(id=${user.id})}" th:method="delete">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <div class="d-flex gap-3 justify-content-center">
                            <button type="submit" class="btn btn-danger btn-lg">
                                <i class="bi bi-check-lg"></i> Yes, Delete
                            </button>
                            <a th:href="@{/admin/users}" class="btn btn-secondary btn-lg">
                                <i class="bi bi-x-lg"></i> Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
