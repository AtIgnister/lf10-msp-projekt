<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" lang="de">
<head>
    <title>Löschung bestätigen</title>
</head>
<body>
<section layout:fragment="content" class="fade-in">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card text-center">
                <div class="card-body py-5 px-4">
                    <span style="font-size: 4rem;">⚠️</span>
                    <h4 class="page-heading mt-3 mb-3">
                        Benutzer wirklich löschen?
                    </h4>
                    <p class="mb-4 fs-5 fw-bold text-danger"
                       th:text="${user.firstname} + ' ' + ${user.lastname} + ' (' + ${user.email} + ')'">
                    </p>

                    <form th:action="@{/admin/users/{id}(id=${user.id})}" th:method="delete">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <div class="d-flex gap-3 justify-content-center">
                            <button type="submit" class="btn btn-danger btn-lg">
                                Ja, löschen
                            </button>
                            <a th:href="@{/admin/users}" class="btn btn-secondary btn-lg">
                                Abbrechen
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
