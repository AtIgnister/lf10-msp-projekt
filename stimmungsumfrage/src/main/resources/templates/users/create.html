<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" lang="de">
<head>
    <title>Benutzer erstellen</title>
</head>
<body>
<section layout:fragment="content" class="fade-in">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0">Neuen Benutzer erstellen</h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/admin/users}" th:object="${user}" th:method="put">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                        <div class="mb-3">
                            <label class="form-label" for="firstname">Vorname</label>
                            <input type="text" class="form-control"
                                   th:field="*{firstname}" id="firstname" required
                                   placeholder="Vorname eingeben">
                            <div th:if="${#fields.hasErrors('firstname')}"
                                 th:errors="*{firstname}" class="text-danger small mt-1"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="lastname">Nachname</label>
                            <input type="text" class="form-control"
                                   th:field="*{lastname}" id="lastname" required
                                   placeholder="Nachname eingeben">
                            <div th:if="${#fields.hasErrors('lastname')}"
                                 th:errors="*{lastname}" class="text-danger small mt-1"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="email">E-Mail</label>
                            <input type="email" class="form-control"
                                   th:field="*{email}" id="email" required
                                   placeholder="beispiel@firma.de">
                            <div th:if="${#fields.hasErrors('email')}"
                                 th:errors="*{email}" class="text-danger small mt-1"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="password">Passwort</label>
                            <input type="password" class="form-control"
                                   th:field="*{password}" id="password" required minlength="8"
                                   placeholder="Mindestens 8 Zeichen">
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="department">Abteilung</label>
                            <select class="form-select" th:field="*{department.id}" id="department" required>
                                <option value="">Abteilung wählen</option>
                                <option th:each="dept : ${departments}"
                                        th:value="${dept.id}"
                                        th:text="${dept.name}"></option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="role">Rolle</label>
                            <select class="form-select" th:field="*{role.id}" id="role" required>
                                <option value="">Rolle wählen</option>
                                <option th:each="role : ${roles}"
                                        th:value="${role.id}"
                                        th:text="${role.name}"></option>
                            </select>
                        </div>

                        <div class="d-flex gap-3 mt-4">
                            <button type="submit" class="btn btn-primary flex-grow-1">Erstellen</button>
                            <a th:href="@{/admin/users}" class="btn btn-secondary">Abbrechen</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
