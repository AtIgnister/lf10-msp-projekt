<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" lang="de_DE">
<head>
    <title>Users List</title>
</head>
<body>
<section layout:fragment="content">
<div class="card">
    <div class="card-header">
        <h4>Create New User</h4>
    </div>
    <div class="card-body">
        <form th:action="@{/admin/users}" th:object="${user}" th:method="put">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <!-- First Name -->
            <div class="mb-3">
                <label class="form-label" for="firstname">First Name</label>
                <input type="text" class="form-control"
                       th:field="*{firstname}" id="firstname" required>
                <div th:if="${#fields.hasErrors('firstname')}"
                     th:errors="*{firstname}" class="text-danger small"></div>
            </div>

            <!-- Last Name -->
            <div class="mb-3">
                <label class="form-label" for="lastname">Last Name</label>
                <input type="text" class="form-control"
                       th:field="*{lastname}" id="lastname" required>
                <div th:if="${#fields.hasErrors('lastname')}"
                     th:errors="*{lastname}" class="text-danger small"></div>
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input type="email" class="form-control"
                       th:field="*{email}" id="email" required>
                <div th:if="${#fields.hasErrors('email')}"
                     th:errors="*{email}" class="text-danger small"></div>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input type="password" class="form-control"
                       th:field="*{password}" id="password" required minlength="8">
            </div>

            <!-- Department -->
            <div class="mb-3">
                <label class="form-label" for="department">Department</label>
                <select class="form-select" th:field="*{department.id}" id="department" required>
                    <option value="">Select Department</option>
                    <option th:each="dept : ${departments}"
                            th:value="${dept.id}"
                            th:text="${dept.name}"></option>
                </select>
            </div>

            <!-- Role -->
            <div class="mb-3">
                <label class="form-label" for="role">Role</label>
                <select class="form-select" th:field="*{role.id}" id="role" required>
                    <option value="">Select Role</option>
                    <option th:each="role : ${roles}"
                            th:value="${role.id}"
                            th:text="${role.name}"></option>
                </select>
            </div>

            <!-- Buttons -->
            <div class="mt-4">
                <button type="submit" class="btn btn-primary">Create User</button>
                <a th:href="@{/admin/users}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
</section>
