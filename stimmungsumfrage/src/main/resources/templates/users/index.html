<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" lang="de">
<head>
    <title>Benutzer</title>
</head>
<body>
<section layout:fragment="content" class="fade-in">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="page-heading">Benutzer</h1>
        <a th:href="@{/admin/users/new}" class="btn btn-primary">
            + Benutzer erstellen
        </a>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-striped table-hover mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Vorname</th>
                    <th>Nachname</th>
                    <th>E-Mail</th>
                    <th>Aktionen</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${userPage.content}">
                    <td th:text="${user.id}"></td>
                    <td th:text="${user.firstname}"></td>
                    <td th:text="${user.lastname}"></td>
                    <td th:text="${user.email}"></td>
                    <td>
                        <div class="d-flex gap-2">
                            <a th:href="@{/admin/users/{id}/edit(id=${user.id})}"
                               class="btn btn-sm btn-primary" title="Bearbeiten">
                                Bearbeiten
                            </a>
                            <a th:href="@{/admin/users/{id}/confirm-delete(id=${user.id})}"
                               class="btn btn-sm btn-danger"
                               title="Löschen">
                                Löschen
                            </a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Pagination -->
    <nav aria-label="Seitennavigation" class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${!userPage.hasPrevious()} ? 'disabled'">
                <a class="page-link" th:href="@{/users(page=${userPage.number - 1}, size=${userPage.size})}"
                   th:if="${userPage.hasPrevious()}">Zurück</a>
            </li>

            <li class="page-item active">
            <span class="page-link">
                Seite <span th:text="${userPage.number + 1}"></span> von <span th:text="${userPage.totalPages}"></span>
            </span>
            </li>

            <li class="page-item" th:classappend="${!userPage.hasNext()} ? 'disabled'">
                <a class="page-link" th:href="@{/users(page=${userPage.number + 1}, size=${userPage.size})}"
                   th:if="${userPage.hasNext()}">Weiter</a>
            </li>
        </ul>
    </nav>
</section>
</body>
</html>
