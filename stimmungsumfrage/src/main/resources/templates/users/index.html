<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" lang="de_DE">
<head>
    <title>Users List</title>
</head>
<body>
<section layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Users</h1>
        <a th:href="@{/admin/users/new}" class="btn btn-primary">
            <i class="bi bi-plus-lg"></i> Create User
        </a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Email</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${userPage.content}">
                <td th:text="${user.id}"></td>
                <td th:text="${user.firstname}"></td>
                <td th:text="${user.lastname}"></td>
                <td th:text="${user.email}"></td>
                <td>
                    <div class="btn-group btn-group-sm" role="group">
                        <a th:href="@{/admin/users/{id}/edit(id=${user.id})}"
                           class="btn btn-primary" title="Edit">
                            <i class="bi bi-pencil"></i> Edit
                        </a>
                        <a th:href="@{/admin/users/{id}/confirm-delete(id=${user.id})}"
                           class="btn btn-warning"
                           title="Confirm Delete">
                            <i class="bi bi-exclamation-triangle"></i> Delete
                        </a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Bootstrap-styled pagination -->
    <nav aria-label="Users pagination">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${!userPage.hasPrevious()} ? 'disabled'">
                <a class="page-link" th:href="@{/users(page=${userPage.number - 1}, size=${userPage.size})}"
                   th:if="${userPage.hasPrevious()}">Previous</a>
            </li>

            <li class="page-item active">
            <span class="page-link">
                Page <span th:text="${userPage.number + 1}"></span> of <span th:text="${userPage.totalPages}"></span>
            </span>
            </li>

            <li class="page-item" th:classappend="${!userPage.hasNext()} ? 'disabled'">
                <a class="page-link" th:href="@{/users(page=${userPage.number + 1}, size=${userPage.size})}"
                   th:if="${userPage.hasNext()}">Next</a>
            </li>
        </ul>
    </nav>
</section>
</body>
</html>
