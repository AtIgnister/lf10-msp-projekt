<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" lang="de">
<head>
    <title>Neuer Kanal</title>
</head>
<body>
<section layout:fragment="content" class="fade-in">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card surface-panel">
                <div class="card-header">
                    <h4 class="mb-0">Neuen Kanal erstellen</h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/channels}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                        <div class="mb-3">
                            <label class="form-label" for="name">Kanalname</label>
                            <input type="text" class="form-control" name="name" id="name"
                                   required placeholder="z.B. Kantine">
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="description">Beschreibung</label>
                            <textarea class="form-control" name="description" id="description"
                                      rows="3" placeholder="Was ist der Zweck dieses Kanals?"></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="feedbackScaleSize">Anzahl Emojis</label>
                            <select class="form-select" name="feedbackScaleSize" id="feedbackScaleSize">
                                <option value="2">2 Emojis – Schlecht / Gut</option>
                                <option value="3">3 Emojis – Schlecht / Neutral / Gut</option>
                                <option value="4">4 Emojis – Sehr schlecht / Schlecht / Gut / Sehr gut</option>
                                <option value="5" selected>5 Emojis – Sehr schlecht / Schlecht / Neutral / Gut / Sehr gut</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label d-block">Emoji-Skala für Feedback</label>
                            <small class="text-secondary-dark d-block mb-3">
                                Lege die Emojis fest, die in diesem Kanal verwendet werden. Je nach Auswahl werden nur 2 bis 5 Emojis angezeigt.
                            </small>

                            <div class="row g-3">
                                <div class="col-md-6" data-emoji-group data-visible-scales="4,5">
                                    <label class="form-label" for="emojiVeryBad">Sehr schlecht</label>
                                    <input type="text" class="form-control" name="emojiVeryBad" id="emojiVeryBad"
                                           value="😡" required>
                                </div>
                                <div class="col-md-6" data-emoji-group data-visible-scales="2,3,4,5">
                                    <label class="form-label" for="emojiBad">Schlecht</label>
                                    <input type="text" class="form-control" name="emojiBad" id="emojiBad"
                                           value="😕" required>
                                </div>
                                <div class="col-md-6" data-emoji-group data-visible-scales="3,5">
                                    <label class="form-label" for="emojiNeutral">Neutral</label>
                                    <input type="text" class="form-control" name="emojiNeutral" id="emojiNeutral"
                                           value="😐" required>
                                </div>
                                <div class="col-md-6" data-emoji-group data-visible-scales="2,3,4,5">
                                    <label class="form-label" for="emojiGood">Gut</label>
                                    <input type="text" class="form-control" name="emojiGood" id="emojiGood"
                                           value="🙂" required>
                                </div>
                                <div class="col-12" data-emoji-group data-visible-scales="4,5">
                                    <label class="form-label" for="emojiVeryGood">Sehr gut</label>
                                    <input type="text" class="form-control" name="emojiVeryGood" id="emojiVeryGood"
                                           value="😄" required>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Kanaltyp</label>
                            <div class="d-flex gap-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="channelType"
                                           value="open" id="type-open" checked>
                                    <label class="form-check-label" for="type-open">🌐 &Ouml;ffentlich</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="channelType"
                                           value="invite-only" id="type-invite">
                                    <label class="form-check-label" for="type-invite">🔒 Nur auf Einladung</label>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex gap-3 mt-4">
                            <button type="submit" class="btn btn-primary flex-grow-1">Erstellen</button>
                            <a th:href="@{/channels}" class="btn btn-secondary">Abbrechen</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            const scaleSelect = document.getElementById('feedbackScaleSize');
            const groups = Array.from(document.querySelectorAll('[data-emoji-group]'));

            function updateEmojiFields() {
                const selected = scaleSelect.value;

                groups.forEach(group => {
                    const shouldShow = group.dataset.visibleScales.split(',').includes(selected);
                    const input = group.querySelector('input');

                    group.classList.toggle('d-none', !shouldShow);
                    input.disabled = !shouldShow;
                    input.required = shouldShow;
                });
            }

            scaleSelect.addEventListener('change', updateEmojiFields);
            updateEmojiFields();
        })();
    </script>
</section>
</body>
</html>
