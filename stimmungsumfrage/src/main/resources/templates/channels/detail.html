<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" lang="de">
<head>
    <title th:text="${channel.name}">Kanal</title>
</head>
<body>
<section layout:fragment="content" class="fade-in">

    <!-- Back + Title -->
    <div class="d-flex align-items-center gap-3 mb-4">
        <a th:href="@{/channels}" class="text-decoration-none text-secondary-dark">&larr; Zur&uuml;ck zu Kan&auml;len</a>
        <div>
            <h2 class="page-heading mb-0" th:text="${channel.name}">Kanal Name</h2>
            <small class="text-secondary-dark" th:text="${channel.description ?: 'Keine Beschreibung'}">Beschreibung</small>
        </div>
    </div>

    <div class="row g-4 mb-4">
        <div class="col-md-6">
            <div class="card surface-panel h-100">
                <div class="card-body">
                    <h5 class="mb-3">📊 Kanal Info</h5>
                    <div class="mb-3">
                        <small class="text-secondary-dark d-block">Typ</small>
                        <span th:text="${channel.channelType.name() == 'OPEN' ? '🌐 Öffentlich' : '🔒 Nur auf Einladung'}">Typ</span>
                    </div>
                    <div class="mb-3">
                        <small class="text-secondary-dark d-block">Erstellt von</small>
                        <span th:text="${channel.creator.firstname + ' ' + channel.creator.lastname}">Creator</span>
                    </div>
                    <div class="mb-3">
                        <small class="text-secondary-dark d-block">Mitglieder (<span th:text="${#sets.size(members)}">0</span>)</small>
                        <div th:each="member : ${members}" class="mt-1">
                            <small>👤 <span th:text="${member.firstname + ' ' + member.lastname}">Name</span></small>
                        </div>
                    </div>
                    <form th:action="@{/channels/{id}/leave(id=${channel.id})}" method="post" class="mt-3">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="btn btn-danger w-100"
                                onclick="return confirm('Kanal wirklich verlassen?')">Kanal verlassen</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Invite Section (invite-only channels) -->
        <div class="col-md-6" th:if="${channel.channelType.name() == 'INVITE_ONLY'}">
            <div class="card surface-panel h-100">
                <div class="card-body">
                    <h5 class="mb-3">✉️ Einladungen</h5>
                    <small class="text-secondary-dark d-block mb-2">Person einladen</small>
                    <form th:action="@{/channels/{id}/invite(id=${channel.id})}" method="post"
                          th:if="${invitableUsers != null && !invitableUsers.isEmpty()}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <select name="userId" class="form-select mb-2" required>
                            <option value="">Benutzer w&auml;hlen</option>
                            <option th:each="u : ${invitableUsers}" th:value="${u.id}"
                                    th:text="${u.firstname + ' ' + u.lastname}"></option>
                        </select>
                        <button type="submit" class="btn btn-primary w-100">Einladung senden</button>
                    </form>
                    <small th:if="${invitableUsers == null || invitableUsers.isEmpty()}"
                           class="text-secondary-dark">Keine weiteren Benutzer zum Einladen.</small>

                    <div th:if="${pendingInvites != null && !pendingInvites.isEmpty()}" class="mt-3">
                        <small class="text-secondary-dark">Ausstehend:
                            <span th:each="inv, stat : ${pendingInvites}">
                                <span th:text="${inv.invitedUser.firstname}">Name</span><span th:if="${!stat.last}">, </span>
                            </span>
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Feedback Section -->
    <div class="card surface-panel">
        <div class="card-body">
            <h5 class="mb-3">📝 Kanal-Feedback</h5>
            <form th:action="@{/channels/{id}/feedback(id=${channel.id})}" method="post" class="mb-4">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div class="d-flex align-items-center gap-2 mb-3">
                    <small class="text-secondary-dark me-2">Stimmung:</small>
                    <input type="radio" class="emoji-radio" name="emoji" id="emoji-angry" value="😡">
                    <label for="emoji-angry" class="emoji-btn mb-0" aria-label="Sehr schlecht">😡</label>

                    <input type="radio" class="emoji-radio" name="emoji" id="emoji-bad" value="😕">
                    <label for="emoji-bad" class="emoji-btn mb-0" aria-label="Schlecht">😕</label>

                    <input type="radio" class="emoji-radio" name="emoji" id="emoji-neutral" value="😐">
                    <label for="emoji-neutral" class="emoji-btn mb-0" aria-label="Neutral">😐</label>

                    <input type="radio" class="emoji-radio" name="emoji" id="emoji-good" value="🙂">
                    <label for="emoji-good" class="emoji-btn mb-0" aria-label="Gut">🙂</label>

                    <input type="radio" class="emoji-radio" name="emoji" id="emoji-great" value="😄">
                    <label for="emoji-great" class="emoji-btn mb-0" aria-label="Sehr gut">😄</label>
                </div>
                <div class="d-flex gap-2">
                    <textarea name="comment" class="form-control" rows="2"
                              placeholder="Feedback zu diesem Kanal hinterlassen..."></textarea>
                    <button type="submit" class="btn btn-primary align-self-end">Senden</button>
                </div>
            </form>

            <div id="channel-feedback-list" class="feedback-panel">
                <div th:if="${#lists.isEmpty(feedbackList)}" class="text-secondary-dark">
                    Noch kein Feedback in diesem Kanal.
                </div>
                <div th:each="fb : ${feedbackList}" class="card surface-panel mb-2">
                    <div class="card-body py-2 px-3">
                        <div class="d-flex justify-content-between mb-1">
                            <small class="text-secondary-dark"
                                   th:text="${#temporals.format(fb.createdAt, 'dd.MM.yyyy HH:mm')}">Datum</small>
                        </div>
                        <div class="d-flex align-items-start gap-2">
                            <span th:if="${fb.emoji}" th:text="${fb.emoji}" style="font-size: 1.25rem;"></span>
                            <span th:if="${fb.comment}" th:text="${fb.comment}">Kommentar</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</section>
</body>
</html>
