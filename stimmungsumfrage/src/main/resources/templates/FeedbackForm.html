<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Feedback Form</title>
</head>

<body>

<section layout:fragment="content">

    <div class="row justify-content-center">
        <div class="col-md-6">

            <h2 class="mb-4">Stimmungsumfrage</h2>

            <form th:method="put" th:action="@{/}" class="card card-body shadow-sm">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div class="mb-3">
                    <label for="feedback" class="form-label">Feedback</label>
                    <input type="text"
                           class="form-control"
                           name="feedback"
                           id="feedback" />
                </div>

                <div class="mb-3">
                    <label for="mood" class="form-label">Mood</label>
                    <select name="mood"
                            id="mood"
                            class="form-select"
                            required>

                        <option value="" disabled selected>Select a mood</option>

                        <option th:each="mood : ${moods}"
                                th:value="${mood.moodName}"
                                th:text="${mood.moodName}">
                        </option>

                    </select>
                </div>

                <button type="submit" class="btn btn-primary">
                    Submit
                </button>

            </form>

        </div>
    </div>

</section>

</body>
</html>
