<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" lang="de">
<head>
    <title>Feedback bestätigt</title>
</head>

<body>

<section layout:fragment="content" class="fade-in">

    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="card p-5">
                <span style="font-size: 3rem;">✅</span>
                <h3 class="page-heading mt-3">Vielen Dank!</h3>
                <p class="text-secondary-dark">Deine Rückmeldung wurde erfolgreich gespeichert.</p>
                <a th:href="@{/}" class="btn btn-primary mt-3">Zurück zur Startseite</a>
            </div>
        </div>
    </div>

</section>

</body>
</html>
