      layout:decorate="~{layout}" lang="de">
<head>
    <title>Feedback Form</title>
</head>

<body>
<section layout:fragment="content" class="fade-in">

    <div class="container">
        <div class="text-center mb-4">
            <h2 class="page-heading">Wie geht es dir heute?</h2>
            <p class="text-secondary-dark">Bewerte deine aktuelle Stimmung</p>
        </div>

        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6">
                <div class="card surface-panel card-hover p-4">
                    <p>Du hast heute schon abgestimmt. Bitte warte 24 Stunden.</p>
                </div>
            </div>
        </div>
    </div>
