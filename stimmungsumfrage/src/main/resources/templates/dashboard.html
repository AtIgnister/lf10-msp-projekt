<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" lang="de">
<head>
    <title>Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<section layout:fragment="content" class="fade-in">

    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2 mb-4">
        <div>
            <h2 class="page-heading mb-1">Team-&Uuml;bersicht</h2>
            <small class="text-secondary-dark" th:if="${statsScope == 'channel' && selectedChannel != null}">
                Kanal: <span th:text="${selectedChannel.name}">Kanal</span>
            </small>
        </div>
        <form th:action="@{/dashboard}" method="get" class="d-flex align-items-center gap-2">
            <label for="channelSelect" class="text-secondary-dark" style="font-size: 0.875rem;">Ansicht</label>
            <select id="channelSelect" name="channelId" class="form-select form-select-sm"
                    onchange="this.form.submit()">
                <option value="" th:selected="${selectedChannelId == null}">Abteilung</option>
                <option th:each="ch : ${userChannels}"
                        th:value="${ch.id}"
                        th:selected="${selectedChannelId == ch.id}"
                        th:text="${ch.name}">
                    Kanal
                </option>
            </select>
        </form>
    </div>

    <div>
        <!-- Header (title + buttons only) -->
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2 mb-3">

            <h5 class="d-flex align-items-center gap-2 mb-0">
                <span>📈</span> Stimmungsverlauf
            </h5>

            <div class="d-flex gap-2 flex-wrap">
                <button class="btn btn-sm btn-secondary chart-filter" data-days="7">7 Tage</button>
                <button class="btn btn-sm btn-primary chart-filter active" data-days="30">30 Tage</button>
                <button class="btn btn-sm btn-secondary chart-filter" data-days="90">90 Tage</button>
            </div>

        </div>

        <!-- Chart (full width row) -->
        <div class="position-relative" style="height: 300px;">
            <canvas id="trend-chart"></canvas>
        </div>

    </div>

    <div class="row g-4 mb-4">
        <!-- Mood Statistics -->
        <div class="col-md-6">
            <div class="card surface-panel h-100">
                <div class="card-body">
                    <h5 class="mb-4 d-flex align-items-center gap-2">
                        <span>📊</span> Stimmungsverteilung
                    </h5>
                    <div th:if="${#lists.isEmpty(moodCounts)}" class="text-secondary-dark">
                        Keine Daten vorhanden.
                    </div>
                    <div th:if="${!#lists.isEmpty(moodCounts)}" class="d-flex flex-column gap-3">
                        <div th:each="mood : ${moodCounts}">
                            <div class="d-flex justify-content-between" style="font-size: 0.875rem;">
                                <span>
                                    <span th:switch="${mood.moodName}">
                                        <span th:case="'HAPPY'">😊</span>
                                        <span th:case="'NEUTRAL'">😐</span>
                                        <span th:case="'SAD'">😢</span>
                                    </span>
                                    <span th:text="${mood.moodName}">Mood</span>
                                </span>
                                <span class="fw-semibold" th:text="${mood.count} + ' Stimmen'">0</span>
                            </div>
                            <div class="stat-bar-track">
                                <div class="stat-bar-fill"
                                     th:classappend="${mood.moodName == 'HAPPY' ? 'good' : (mood.moodName == 'NEUTRAL' ? 'neutral' : 'bad')}"
                                     th:style="'width: ' + ${mood.percentage * 100} + '%'">
                                </div>
                            </div>
                        </div>

                        <p class="text-secondary-dark mt-2 pt-2 border-top" style="font-size: 0.75rem;"
                           th:text="${totalVotes} + ' Abstimmungen insgesamt'">
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Quick Info -->
        <div class="col-md-6">
            <div class="card surface-panel h-100">
                <div class="card-body">
                    <h5 class="mb-4 d-flex align-items-center gap-2">
                        <span>🌐</span> &Uuml;bersicht
                    </h5>
                    <div class="d-flex flex-column gap-3">
                        <div th:each="mood : ${moodCounts}" class="d-flex align-items-center gap-3">
                            <span th:switch="${mood.moodName}" style="font-size: 2rem;">
                                <span th:case="'HAPPY'">😊</span>
                                <span th:case="'NEUTRAL'">😐</span>
                                <span th:case="'SAD'">😢</span>
                            </span>
                            <div>
                                <p class="mb-0 fw-semibold" th:text="${mood.moodName}">Mood</p>
                                <p class="mb-0 text-secondary-dark" style="font-size: 0.875rem;"
                                   th:text="${#numbers.formatDecimal(mood.percentage * 100, 1, 0)} + '%'">0%</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Recent Feedbacks -->
    <div class="card surface-panel">
        <div class="card-body">
            <h5 class="mb-4 d-flex align-items-center gap-2">
                <span>💬</span> Aktuelle Kommentare (anonym)
            </h5>

            <div th:if="${statsScope == 'department'}">
                <div th:if="${#lists.isEmpty(recentFeedbacks)}" class="text-secondary-dark">
                    Keine Kommentare vorhanden.
                </div>
                <div th:if="${recentFeedbacks != null && !#lists.isEmpty(recentFeedbacks)}"
                     id="recent-comments" class="d-flex flex-column gap-2">
                    <div th:each="fb : ${recentFeedbacks}" class="card">
                        <div class="card-body py-2 px-3">
                            <div class="d-flex align-items-center gap-2 mb-1">
                                <span th:switch="${fb.mood.moodName}" style="font-size: 1.125rem;">
                                    <span th:case="'HAPPY'">😊</span>
                                    <span th:case="'NEUTRAL'">😐</span>
                                    <span th:case="'SAD'">😢</span>
                                </span>
                                <small class="text-secondary-dark"
                                       th:text="${fb.mood.moodName + ' • ' + fb.department.name}">Mood</small>
                                <small class="text-secondary-dark ms-auto"
                                       th:text="${#temporals.format(fb.createdAt, 'dd.MM. HH:mm')}">Datum</small>
                            </div>
                            <p class="mb-0" style="font-size: 0.875rem;" th:text="${fb.feedbackText}">Kommentar</p>
                        </div>
                    </div>
                </div>
            </div>

            <div th:if="${statsScope == 'channel'}">
                <div th:if="${#lists.isEmpty(recentChannelFeedbacks)}" class="text-secondary-dark">
                    Keine Kommentare vorhanden.
                </div>
                <div th:if="${recentChannelFeedbacks != null && !#lists.isEmpty(recentChannelFeedbacks)}"
                     id="recent-channel-comments" class="d-flex flex-column gap-2">
                    <div th:each="fb : ${recentChannelFeedbacks}" class="card">
                        <div class="card-body py-2 px-3">
                            <div class="d-flex align-items-center gap-2 mb-1">
                                <span th:if="${fb.emoji}" th:text="${fb.emoji}" style="font-size: 1.125rem;"></span>
                                <small class="text-secondary-dark ms-auto"
                                       th:text="${#temporals.format(fb.createdAt, 'dd.MM. HH:mm')}">Datum</small>
                            </div>
                            <p class="mb-0" style="font-size: 0.875rem;" th:text="${fb.comment}">Kommentar</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        const allLabels  = /*[[${chartLabels}]]*/  [];
        const allHappy   = /*[[${chartHappy}]]*/   [];
        const allNeutral = /*[[${chartNeutral}]]*/ [];
        const allSad     = /*[[${chartSad}]]*/     [];

        let activeDays = 30;

        function slice(arr, days) { return arr.slice(-days); }

        const chart = new Chart(document.getElementById('trend-chart'), {
            type: 'line',
            data: {
                labels: slice(allLabels, activeDays),
                datasets: [
                    {
                        label: 'Positiv 😊',
                        data: slice(allHappy, activeDays),
                        borderColor: '#34d399',
                        backgroundColor: 'rgba(52,211,153,0.1)',
                        tension: 0.4, fill: true, pointRadius: 2
                    },
                    {
                        label: 'Neutral 😐',
                        data: slice(allNeutral, activeDays),
                        borderColor: '#fbbf24',
                        backgroundColor: 'rgba(251,191,36,0.1)',
                        tension: 0.4, fill: true, pointRadius: 2
                    },
                    {
                        label: 'Negativ 😢',
                        data: slice(allSad, activeDays),
                        borderColor: '#f87171',
                        backgroundColor: 'rgba(248,113,113,0.1)',
                        tension: 0.4, fill: true, pointRadius: 2
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                plugins: { legend: { position: 'top' } },
                scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
            }
        });

        document.querySelectorAll('.chart-filter').forEach(btn => {
            btn.addEventListener('click', () => {
                const days = parseInt(btn.dataset.days);
                activeDays = days;
                chart.data.labels = slice(allLabels, days);
                chart.data.datasets[0].data = slice(allHappy, days);
                chart.data.datasets[1].data = slice(allNeutral, days);
                chart.data.datasets[2].data = slice(allSad, days);
                chart.update();
                document.querySelectorAll('.chart-filter').forEach(b => {
                    b.className = (b === btn)
                        ? 'btn btn-sm btn-primary chart-filter active'
                        : 'btn btn-sm btn-secondary chart-filter';
                });
            });
        });
    </script>

</section>
</body>
</html>
