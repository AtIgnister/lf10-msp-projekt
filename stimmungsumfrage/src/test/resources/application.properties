debug=false
spring.main.log-startup-info=false
logging.level.org.springframework.boot.autoconfigure.condition=OFF
logging.level.org.springframework.boot.autoconfigure=OFF
logging.level.root=INFO
spring.main.banner-mode=off
logging.level.org.springframework=ERROR
logging.level.org.lf10.stimmungsumfrage=DEBUG
server.error.path=/error
# Datasource configuration
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

app.pseudonym.secret=${APP_PSEUDONYM_SECRET:dev-only-secret-test}
